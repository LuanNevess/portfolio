<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="finBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1426"/>
      <stop offset="100%" stop-color="#141f3d"/>
    </linearGradient>
    <linearGradient id="finAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#finBg2)"/>
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#0b101d" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="560" height="40" rx="12" fill="#111827"/>
  <circle cx="45" cy="40" r="5" fill="#ef4444"/>
  <circle cx="62" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="40" r="5" fill="#10b981"/>
  <text x="110" y="44" fill="#94a3b8" font-family="monospace" font-size="12">Fin • Evolução de Saldo &amp; Rendimentos (Canvas Nativo)</text>

  <!-- Metric Badges -->
  <g transform="translate(45, 75)">
    <rect x="0" y="0" width="160" height="60" rx="8" fill="#131e36" stroke="#1e293b"/>
    <text x="15" y="22" fill="#64748b" font-family="sans-serif" font-size="10">Patrimônio Consolidado</text>
    <text x="15" y="48" fill="#10b981" font-family="monospace" font-size="18" font-weight="bold">R$ 28.940,50</text>

    <rect x="175" y="0" width="160" height="60" rx="8" fill="#131e36" stroke="#1e293b"/>
    <text x="190" y="22" fill="#64748b" font-family="sans-serif" font-size="10">Rendimento Acumulado</text>
    <text x="190" y="48" fill="#06b6d4" font-family="monospace" font-size="18" font-weight="bold">+R$ 1.842,10</text>

    <rect x="350" y="0" width="160" height="60" rx="8" fill="#131e36" stroke="#1e293b"/>
    <text x="365" y="22" fill="#64748b" font-family="sans-serif" font-size="10">Bancos Conectados</text>
    <text x="365" y="48" fill="#3b82f6" font-family="monospace" font-size="18" font-weight="bold">Nubank • Inter • Itaú</text>
  </g>

  <!-- Chart Area -->
  <g transform="translate(45, 155)">
    <rect x="0" y="0" width="510" height="135" rx="8" fill="#131c33" stroke="#1e293b"/>
    <text x="15" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11">Curva de Patrimônio &amp; Rendimentos Mensais</text>
    
    <!-- Area Curve -->
    <path d="M 20,115 Q 120,95 200,85 T 340,55 T 480,30 L 480,125 L 20,125 Z" fill="url(#finAreaGrad)"/>
    <path d="M 20,115 Q 120,95 200,85 T 340,55 T 480,30" fill="none" stroke="#10b981" stroke-width="2.5"/>

    <!-- Bar overlays (Rendimentos) -->
    <rect x="70" y="90" width="16" height="35" rx="3" fill="#06b6d4" opacity="0.8"/>
    <rect x="150" y="80" width="16" height="45" rx="3" fill="#06b6d4" opacity="0.8"/>
    <rect x="230" y="65" width="16" height="60" rx="3" fill="#06b6d4" opacity="0.9"/>
    <rect x="310" y="50" width="16" height="75" rx="3" fill="#06b6d4" opacity="0.9"/>
    <rect x="390" y="35" width="16" height="90" rx="3" fill="#06b6d4"/>
    <rect x="470" y="25" width="16" height="100" rx="3" fill="#06b6d4"/>

    <!-- Tooltip simulation -->
    <rect x="320" y="10" width="135" height="26" rx="4" fill="#0f172a" stroke="#06b6d4"/>
    <text x="330" y="26" fill="#06b6d4" font-family="monospace" font-size="10">Out/2026: +R$ 214,30</text>
  </g>
