<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#141f3d"/>
    </linearGradient>
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="areaGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgGrad1)"/>
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#090d18" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="560" height="40" rx="12" fill="#111827"/>
  <circle cx="45" cy="40" r="5" fill="#ef4444"/>
  <circle cx="62" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="40" r="5" fill="#10b981"/>
  <text x="110" y="44" fill="#94a3b8" font-family="monospace" font-size="12">credit_risk_model_evaluation.py • AUC: 0.91</text>
  
  <!-- Content: ROC Curve / Model Metrics -->
  <rect x="40" y="80" width="160" height="70" rx="8" fill="#131d33" stroke="#1e293b"/>
  <text x="55" y="105" fill="#64748b" font-family="sans-serif" font-size="11">Acurácia Global</text>
  <text x="55" y="135" fill="#06b6d4" font-family="monospace" font-size="22" font-weight="bold">86.4%</text>

  <rect x="220" y="80" width="160" height="70" rx="8" fill="#131d33" stroke="#1e293b"/>
  <text x="235" y="105" fill="#64748b" font-family="sans-serif" font-size="11">F1-Score Preditivo</text>
  <text x="235" y="135" fill="#10b981" font-family="monospace" font-size="22" font-weight="bold">0.882</text>

  <rect x="400" y="80" width="160" height="70" rx="8" fill="#131d33" stroke="#1e293b"/>
  <text x="415" y="105" fill="#64748b" font-family="sans-serif" font-size="11">Inadimplência Evitada</text>
  <text x="415" y="135" fill="#3b82f6" font-family="monospace" font-size="22" font-weight="bold">-24.5%</text>

  <!-- Chart Area -->
  <g transform="translate(50, 180)">
    <!-- Grid lines -->
    <line x1="0" y1="0" x2="500" y2="0" stroke="#1e293b" stroke-dasharray="4"/>
    <line x1="0" y1="40" x2="500" y2="40" stroke="#1e293b" stroke-dasharray="4"/>
    <line x1="0" y1="80" x2="500" y2="80" stroke="#1e293b" stroke-dasharray="4"/>
    <line x1="0" y1="120" x2="500" y2="120" stroke="#334155"/>
    
    <!-- Area & Line Curve -->
    <path d="M 0,115 Q 120,95 200,60 T 360,20 T 500,8 L 500,120 L 0,120 Z" fill="url(#areaGrad1)"/>
    <path d="M 0,115 Q 120,95 200,60 T 360,20 T 500,8" fill="none" stroke="url(#lineGrad1)" stroke-width="3"/>
    
    <!-- Baseline -->
    <line x1="0" y1="120" x2="500" y2="0" stroke="#475569" stroke-dasharray="5" stroke-width="1.5"/>
    <circle cx="360" cy="20" r="5" fill="#06b6d4"/>
    <circle cx="500" cy="8" r="5" fill="#3b82f6"/>
  </g>
</svg>
