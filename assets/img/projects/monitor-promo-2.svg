<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPromo2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="fastApiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadowP2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#bgGradPromo2)"/>

  <!-- Window Frame -->
  <rect x="25" y="16" width="550" height="328" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5" filter="url(#shadowP2)"/>

  <!-- Window Header -->
  <rect x="25" y="16" width="550" height="42" rx="14" fill="#111827"/>
  <rect x="25" y="44" width="550" height="14" fill="#111827"/>
  <circle cx="48" cy="37" r="5" fill="#ef4444"/>
  <circle cx="65" cy="37" r="5" fill="#f59e0b"/>
  <circle cx="82" cy="37" r="5" fill="#10b981"/>
  <text x="110" y="41" fill="#94a3b8" font-family="monospace" font-size="11.5">api.monitor-promocoes • FastAPI &amp; Background Workers</text>
  <rect x="440" y="27" width="120" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)"/>
  <text x="452" y="41" fill="#10b981" font-family="monospace" font-size="9.5" font-weight="bold">APScheduler: 10m</text>

  <!-- Architecture Flow -->
  <g transform="translate(45, 75)">
    <!-- Node 1: WhatsApp Inbound -->
    <rect x="0" y="0" width="150" height="64" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="12" y="22" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">WhatsApp Webhook</text>
    <text x="12" y="38" fill="#94a3b8" font-family="monospace" font-size="9">POST /api/webhook</text>
    <text x="12" y="52" fill="#22c55e" font-family="sans-serif" font-size="9">Evolution API / Z-API</text>

    <!-- Arrow 1 -->
    <path d="M152 32 L178 32" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="3,3"/>
    <circle cx="180" cy="32" r="3" fill="#06b6d4"/>

    <!-- Node 2: FastAPI Core Engine -->
    <rect x="185" y="0" width="165" height="64" rx="8" fill="#132337" stroke="#0284c7" stroke-width="1.5"/>
    <text x="197" y="22" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">FastAPI Core Router</text>
    <text x="197" y="38" fill="#cbd5e1" font-family="monospace" font-size="9">bot.py &amp; comparator</text>
    <text x="197" y="52" fill="#06b6d4" font-family="sans-serif" font-size="9">Asynchronous Worker</text>

    <!-- Arrow 2 -->
    <path d="M352 32 L378 32" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="380" cy="32" r="3" fill="#06b6d4"/>

    <!-- Node 3: Nodriver Scraper -->
    <rect x="385" y="0" width="125" height="64" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="397" y="22" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">Nodriver Scraper</text>
    <text x="397" y="38" fill="#94a3b8" font-family="monospace" font-size="9">Bypass Anti-Bot</text>
    <text x="397" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="9">Nike, Amazon, etc.</text>

    <!-- Lower Level: Database & Engine Stats -->
    <g transform="translate(0, 84)">
      <!-- Left Panel: SQLite DB & History -->
      <rect x="0" y="0" width="245" height="140" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>
      <text x="14" y="24" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">💾 SQLite • Histórico de Preços</text>
      
      <!-- Mini Chart Line -->
      <path d="M20 100 Q 60 70, 90 85 T 150 45 T 220 55" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
      <circle cx="150" cy="45" r="4" fill="#22c55e"/>
      <text x="135" y="35" fill="#22c55e" font-family="monospace" font-size="9" font-weight="bold">R$ 449</text>
      
      <line x1="18" y1="110" x2="225" y2="110" stroke="#374151" stroke-width="1"/>
      <text x="20" y="125" fill="#94a3b8" font-family="sans-serif" font-size="9">Rastreamento de Menor Preço Histórico</text>

      <!-- Right Panel: Comparator & Real Coupons Engine -->
      <rect x="260" y="0" width="250" height="140" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>
      <text x="274" y="24" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">⚡ Motor de Cupons &amp; Match Multiloja</text>
      
      <rect x="274" y="38" width="222" height="26" rx="4" fill="#1e293b"/>
      <text x="284" y="54" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Nike: R$ 599 | Netshoes: R$ 519</text>
      
      <rect x="274" y="70" width="222" height="26" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="284" y="86" fill="#6ee7b7" font-family="sans-serif" font-size="9.5" font-weight="bold">Centauro + Cupom CORRE10: R$ 449</text>
      
      <text x="274" y="122" fill="#38bdf8" font-family="sans-serif" font-size="9.5">✓ Notificação instantânea com deep link</text>
    </g>
  </g>
</svg>
